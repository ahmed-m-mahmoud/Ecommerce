<section class="category-item p-0 m-0">
    <div
        class="tile"
        [routerLink]="['/products']"
        [queryParams]="queryParams"
        routerLinkActive="active"
    >
        <div class="tile__icon">
            @switch (icon) {
                @case ('phones') {
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="7" y="2.5" width="10" height="19" rx="2.4" />
                        <path d="M10.5 3.8h3" />
                        <path d="M12 18.6v.03" />
                        <path d="M7 17h10" />
                    </svg>
                }
                @case ('computers') {
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3.5" y="4.5" width="17" height="11.5" rx="1.6" />
                        <path d="M2 19h20" />
                        <path d="M10.2 19v-.5a1.8 1.8 0 0 1 3.6 0v.5" />
                    </svg>
                }
                @case ('headphones') {
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 14.5v-2.2a8 8 0 0 1 16 0v2.2" />
                        <rect x="3.5" y="14" width="4.2" height="6.5" rx="2.1" />
                        <rect x="16.3" y="14" width="4.2" height="6.5" rx="2.1" />
                    </svg>
                }
                @case ('smartwatches') {
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="7" y="6.5" width="10" height="11" rx="3" />
                        <path d="M9.5 6.5 9 2.5h6l-.5 4" />
                        <path d="M9.5 17.5 9 21.5h6l-.5-4" />
                        <path d="M12.8 11.05v2.9" />
                        <path d="M11.2 11.05v2.9" />
                    </svg>
                }
            }
        </div>

        <div class="tile__label">
            <ng-content select="[title]"> </ng-content>
        </div>

        <div class="tile__go" aria-hidden="true">
            <i class="pi pi-arrow-right"></i>
        </div>
    </div>
</section>
