<section class="shared-header">
    <div class="container">
        <div class="shared-header__inner">
            <div class="shared-header__kicker">
                <span class="shared-header__dot" aria-hidden="true"></span>
                <ng-content select="[header-title]"></ng-content>
            </div>
            <h2 class="shared-header__title">
                <ng-content select="[header-desc]"></ng-content>
            </h2>
            <div class="shared-header__line" aria-hidden="true"></div>
        </div>
    </div>
</section>
